<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        .note-card { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .note-card h3 { color: #2c3e50; margin: 0 0 8px 0; }
        .subject-badge { background: #3498db; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        .search-box { display: flex; gap: 10px; margin: 20px 0; }
        .search-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .search-box button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .no-notes { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <h1>📚 Student Notes App</h1>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search notes by title...">
        <button onclick="searchNotes()">Search</button>
    </div>

    <div id="notes-list">
        {% if notes %}
            {% for note in notes %}
            <div class="note-card">
                <h3><a href="/note/{{ note.pk }}/">{{ note.title }}</a></h3>
                <span class="subject-badge">{{ note.subject }}</span>
                <p>{{ note.content|truncatewords:20 }}</p>
                <small>Created: {{ note.created_at|date:"M d, Y" }}</small>
            </div>
            {% endfor %}
        {% else %}
            <div class="no-notes">
                <p>No notes yet. Add some from the admin panel.</p>
            </div>
        {% endif %}
    </div>

    <script>
        async function searchNotes() {
            const q = document.getElementById('searchInput').value;
            const res = await fetch('/search/?q=' + encodeURIComponent(q));
            const data = await res.json();
            const list = document.getElementById('notes-list');
            if (data.results.length === 0) {
                list.innerHTML = '<div class="no-notes"><p>No results found.</p></div>';
            } else {
                list.innerHTML = data.results.map(n =>
                    `<div class="note-card"><h3>${n.title}</h3><span class="subject-badge">${n.subject}</span></div>`
                ).join('');
            }
        }
    </script>
</body>
</html>
