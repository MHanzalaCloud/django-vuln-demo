<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        .card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .subject-badge { background: #3498db; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; }
        a { color: #3498db; }
        .meta { color: #999; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <p><a href="/">← Back to all notes</a></p>
    <div class="card">
        <h1>{{ note.title }}</h1>
        <span class="subject-badge">{{ note.subject }}</span>
        <p>{{ note.content }}</p>
        <div class="meta">
            Created: {{ note.created_at|date:"M d, Y H:i" }} |
            Updated: {{ note.updated_at|date:"M d, Y H:i" }}
        </div>
    </div>
</body>
</html>
